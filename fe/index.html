<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E1D1" />
    <title>Kimchi — Dinner, pieced from what you've got</title>
    <meta
      name="description"
      content="Photograph your counter. A fine-tuned vision model names every ingredient and an LLM turns them into three recipes you can cook tonight."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Only the two syllables of the wordmark are fetched from the Hangul face. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&text=%EA%B9%80%EC%B9%98&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the theme before first paint to avoid a light-mode flash. Keep
      // the storage key and fallback logic in sync with src/hooks/useTheme.js.
      (function () {
        try {
          var stored = localStorage.getItem('kimchi-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (error) {
          // localStorage/matchMedia unavailable — fall back to the light theme.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
