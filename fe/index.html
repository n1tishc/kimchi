<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>Kimchi — Cook from what you have</title>
    <meta
      name="description"
      content="Photograph your ingredients and let AI turn them into recipes you can actually cook."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the theme before first paint to avoid a light-mode flash. Keep
      // the storage key and fallback logic in sync with src/hooks/useTheme.js.
      (function () {
        try {
          var stored = localStorage.getItem('kimchi-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (error) {
          // localStorage/matchMedia unavailable — fall back to the light theme.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
